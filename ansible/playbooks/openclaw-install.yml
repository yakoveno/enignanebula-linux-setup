---
# Ansible playbook for OpenClaw setup with security considerations
- name: Install and configure OpenClaw for EnigmaNebula with security
  hosts: localhost
  connection: local
  become: yes
  
  vars:
    username: "{{ lookup('env', 'USER') }}"
    openclaw_user_dir: "/home/{{ username }}/.openclaw"
    
  tasks:
    - name: Install Node.js and npm
      apt:
        name:
          - nodejs
          - npm
        state: present
        
    - name: Install OpenClaw globally
      npm:
        name: openclaw
        global: yes
        state: present
        
    - name: Create OpenClaw workspace directory
      file:
        path: "{{ openclaw_user_dir }}/workspace"
        state: directory
        owner: "{{ username }}"
        mode: '0755'
        
    - name: Create EnigmaNebula workspace directories
      file:
        path: "{{ openclaw_user_dir }}/workspace/{{ item }}"
        state: directory
        owner: "{{ username }}"
        mode: '0755'
      loop:
        - memory
        - EnigmaNebula
        - EnigmaNebula/connections
        - EnigmaNebula/identity
        - EnigmaNebula/learning
        - EnigmaNebula/memory
        
    - name: Copy OpenClaw configuration
      template:
        src: openclaw.config.j2
        dest: "{{ openclaw_user_dir }}/openclaw.json"
        owner: "{{ username }}"
        mode: '0644'
        
    - name: Set up OpenClaw service
      template:
        src: openclaw.service.j2
        dest: /etc/systemd/system/openclaw.service
        mode: '0644'
        
    - name: Enable and start OpenClaw service
      systemd:
        name: openclaw
        daemon_reload: yes
        state: started
        enabled: yes
        
    - name: Configure firewall for OpenClaw
      ufw:
        rule: allow
        port: '18789'
        proto: tcp
        
    # Security measures based on Moltbook discussions about agent security
    - name: Create security audit directory
      file:
        path: "{{ openclaw_user_dir }}/security"
        state: directory
        owner: "{{ username }}"
        mode: '0700'
        
    - name: Create security configuration file
      copy:
        content: |
          # Security Configuration for EnigmaNebula
          
          # Audit all agent activities
          audit_enabled: true
          audit_log_location: "{{ openclaw_user_dir }}/security/activity.log"
          
          # Limit agent permissions
          permission_limits:
            - restrict_filesystem_access: true
            - limit_network_connections: true
            - restrict_system_commands: true
          
          # Memory protection
          memory_protection:
            - encrypt_sensitive_data: true
            - limit_memory_exposure: true
          
          # Skill verification (addressing the supply chain attack concerns)
          skill_verification:
            - require_signed_skills: true
            - verify_skill_sources: true
            - maintain_skill_audit_trail: true
        dest: "{{ openclaw_user_dir }}/security/config.yaml"
        owner: "{{ username }}"
        mode: '0600'
        
    - name: Print security-aware completion message
      debug:
        msg: "OpenClaw installation and security configuration complete - following best practices from Moltbook security discussions"